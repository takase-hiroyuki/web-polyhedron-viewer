<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D多面体・幾何学アニメーションビューア</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #fff5f8;
      color: #522e3d;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(255, 238, 244, 0.94);
      border-bottom: 1px solid #f8bbd0;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 10;
    }
    .title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    select, button {
      background: #ffffff;
      color: #522e3d;
      border: 1px solid #f48fb1;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    select:hover, button:hover { background: #ffe4ee; }
    button.primary {
      background: #f06292;
      border-color: #ec407a;
      color: #ffffff;
      font-weight: 600;
    }
    button.primary:hover { background: #ec407a; }
    #canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    footer {
      background: rgba(255, 238, 244, 0.94);
      border-top: 1px solid #f8bbd0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    #frame-slider {
      flex: 1;
      accent-color: #f06292;
      cursor: pointer;
    }
    #frame-label {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      min-width: 110px;
      text-align: right;
      color: #7b4b5e;
    }
    #status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 245, 248, 0.95);
      color: #522e3d;
      padding: 14px 22px;
      border-radius: 14px;
      border: 1px solid #f48fb1;
      font-size: 15px;
      pointer-events: none;
    }
    .hidden { display: none !important; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <div class="title-area">
      <select id="model-select" aria-label="図形モデル選択"></select>
    </div>
    <div>
      <button id="copy-url-btn" class="primary">共有URLをコピー</button>
    </div>
  </header>
  <div id="canvas-container">
    <div id="status-overlay">読み込み中...</div>
  </div>
  <footer>
    <button id="play-pause-btn">一時停止</button>
    <input type="range" id="frame-slider" min="1" max="100" value="1" />
    <span id="frame-label">Frame: 1 / 1</span>
  </footer>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
